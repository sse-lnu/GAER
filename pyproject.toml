[project]
name = "project"
version = "0.1.0"
requires-python = ">=3.11.11, <3.12"
dependencies = [
  "torch-geometric==2.7.0",
  "numpy==1.26.4",
  "pandas==2.2.3",
  "node2vec==0.5.0",
  "scikit-learn==1.4.1.post1",
  "networkx==3.2.1",
  "gensim==4.3.3",
  "nltk==3.8.1",
  "tqdm==4.66.5",
]

[project.optional-dependencies]
cpu = [
  "torch==2.8.0",
  "torch-scatter==2.1.2",
  "torch-sparse==0.6.18",
  "torch-cluster==1.6.3",
  "torch-spline-conv==1.2.2",
]

gpu = [
  "torch==2.8.0",
  "torch-scatter==2.1.2",
  "torch-sparse==0.6.18",
  "torch-cluster==1.6.3",
  "torch-spline-conv==1.2.2",
]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "gpu" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu129", extra = "gpu" },
]

torch-scatter = [
  { index = "pyg-t280-cpu", extra = "cpu" },
  { index = "pyg-t280-cu129", extra = "gpu" },
]
torch-sparse = [
  { index = "pyg-t280-cpu", extra = "cpu" },
  { index = "pyg-t280-cu129", extra = "gpu" },
]
torch-cluster = [
  { index = "pyg-t280-cpu", extra = "cpu" },
  { index = "pyg-t280-cu129", extra = "gpu" },
]
torch-spline-conv = [
  { index = "pyg-t280-cpu", extra = "cpu" },
  { index = "pyg-t280-cu129", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[[tool.uv.index]]
name = "pyg-t280-cpu"
url = "https://data.pyg.org/whl/torch-2.8.0+cpu.html"
format = "flat"
explicit = true

[[tool.uv.index]]
name = "pyg-t280-cu129"
url = "https://data.pyg.org/whl/torch-2.8.0+cu129.html"
format = "flat"
explicit = true
